[package]
name = "notekeeper"
version = "0.3.1"
edition = "2021"
description = "A small command-line note store"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
